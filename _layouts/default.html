{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.ui[lang] -%}
{%- assign p = site.data.profile -%}
<!doctype html>
<html lang="{% if lang == 'zh' %}zh-CN{% else %}en{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ p.name[lang] }}{% if lang == 'zh' %} · 个人主页{% else %} · Homepage{% endif %}</title>
  <meta name="description" content="{{ p.bio[lang] | strip_newlines | truncate: 160 }}">
  <meta name="author" content="{{ p.name.en }}">
  <meta property="og:title" content="{{ p.name[lang] }}">
  <meta property="og:description" content="{{ p.role[lang] }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="alternate" hreflang="en" href="{{ site.url }}/">
  <link rel="alternate" hreflang="zh-CN" href="{{ site.url }}/zh/">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <script>
    document.documentElement.classList.add("js");
    try { var s = localStorage.getItem("theme"); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
