bio:
  en: >-
    I am a master's student at the School of Economics, Nankai University. My research lies in
    mathematical Marxian economics and its empirical applications. On the theoretical side, I work on
    global production networks, digital capitalism and income distribution. On the empirical side, I
    try to combine macro and micro data in the estimation of linear production models. I am committed
    to analysing the reality of China with modern analytical tools and the basic principles of Marxian
    economics.
  zh: >-
    南开大学经济学院硕士研究生，研究方向为数理马克思主义经济学与经验研究。理论研究方面，主要关注全球生产网络、
    数字资本主义、收入分配等问题；经验研究方面，致力于在线性生产模型的实证方法中推进宏观数据与微观数据的结合。
    希望运用现代分析工具与马克思主义政治经济学基本原理，分析和解释中国现实。

