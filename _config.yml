# Site settings — page content lives in _data/*.yml
title: "Wangcheng Qu · 瞿王城"
url: "https://qwaeng.github.io"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle

# Blog posts: put Markdown files in _posts/ named YYYY-MM-DD-title.md.
# Add `lang: zh` or `lang: en` to show a post on only one language version.
defaults:
  - scope:
      type: posts
    values:
      layout: post
      nav: blog
      lang: en
permalink: /blog/:year/:title/
